[project]
name = "weasyprint-mcp-server"
version = "0.1.0"
description = "WeasyPrint MCP Server"
authors = [
    {name = "adam@aigents.services"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "weasyprint (>=65.1,<66.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pydantic (>=2.11.3,<3.0.0)",
    "celery (>=5.5.2,<6.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "redis (>=5.2.1,<6.0.0)"
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
black = "^25.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
