<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: {{ branding_color }};
            color: #333;
        }
        .header {
            text-align: center;
            padding: 20px;
        }
        .logo {
            max-width: 200px;
        }
        .content {
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="{{ logo_path }}" alt="Logo" class="logo">
        <h1>{{ client_name }}</h1>
    </div>
    <div class="content">
        <p>This is a sample template with dynamic branding elements.</p>
    </div>
</body>
</html>
